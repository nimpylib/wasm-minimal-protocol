name: nimble test
on:
  push:
    branches-ignore:
      - 'feat-*'
    paths:
      - '**/*.nim'
      - './*.nimble'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
env:
  nim-version: 'stable'
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache nimble
      id: cache-nimble
      uses: actions/cache@v4
      with:
        path: ~/.nimble
        key: ${{ runner.os }}-nimble
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ env.nim-version }}

    - name: setup wasm-stub
      uses: robinraju/release-downloader@v1
      with:
        latest: true
        repository: astrale-sharp/wasm-minimal-protocol
        fileName: 'wasi-stub-x86_64-unknown-linux-musl.tar.gz'
        extract: true

    - name: Add wasm-stub to PATH
      run: |
        stubdir="${{ github.workspace }}/wasi-stub-x86_64-unknown-linux-musl"
        chmod +x "$stubdir/wasi-stub"
        echo "$stubdir" >> "$GITHUB_PATH"

    - name: setup wasi sdk
      uses: konsumer/install-wasi-sdk@v1
    - name: setup typst
      uses: typst-community/setup-typst@v4
    - name: test
      run: |
        nimble build
        nimble test

